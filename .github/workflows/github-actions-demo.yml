name: Changelog Creator
run-name: ${{ github.actor }} is creating a changelog 🚀
on:
  pull_request:
    types:
      - closed
    branches:
      - main
jobs:
  Changelog-Creator:
    runs-on: ubuntu-latest
    steps:
      - name: Get Changelog
        run: |
          echo "::set-output name=changelog::$(gh pr view ${{ github.event.number }} --json body | jq -r '.body | scan("## Changelog") | .[1]')"
        id: changelog
      - name: Print Changelog
        run: echo "${{ steps.changelog.outputs.changelog }}"
      - name: Create Changelog
        run: |
          echo "${{ steps.changelog.outputs.changelog }}" > CHANGELOG.md
          git add CHANGELOG.md
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git commit -m "Changelog for PR #${{ github.event.number }}"
          git push
   