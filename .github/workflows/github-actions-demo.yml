name: Changelog Creator
run-name: ${{ github.actor }} is creating a changelog 🚀

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Get PR Metadata & Changelog
        id: pr_data
        run: |
          PR_JSON=$(gh pr view ${{ github.event.number }} --json title,author,number,body,url,mergedAt)

          TITLE=$(echo "$PR_JSON" | jq -r '.title')
          AUTHOR=$(echo "$PR_JSON" | jq -r '.author.login')
          NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          URL=$(echo "$PR_JSON" | jq -r '.url')
          DATE=$(echo "$PR_JSON" | jq -r '.mergedAt' | cut -d"T" -f1 | awk -F- '{print $3 "-" $2 "-" $1}')
          # Extract lines under "## Release Changelog (Required)" section until next heading or EOF
          CHANGELOG=$(echo "$PR_JSON" | jq -r '.body' | awk '/^## Release Changelog \(Required\)/{flag=1; next} /^## /{flag=0} flag')

          # Escape any special characters in changelog for YAML multiline
          CHANGELOG_ESCAPED=$(printf '%s\n' "$CHANGELOG")

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT
          echo "number=$NUMBER" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_ESCAPED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Format and prepend changelog entry
        run: |
          ENTRY="## ${{ steps.pr_data.outputs.date }}\n\n### [#${{ steps.pr_data.outputs.number }}](${{ steps.pr_data.outputs.url }}) ${{ steps.pr_data.outputs.title }}  \n*Author:* @${{ steps.pr_data.outputs.author }}\n\n**Changelog:**  \n"

          # Add each changelog line with dash and space prefix, ignoring empty lines
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              ENTRY+="- $line\n"
            fi
          done <<< "${{ steps.pr_data.outputs.changelog }}"

          ENTRY+="\n---\n\n"

          # Prepend entry to existing CHANGELOG.md or create if missing
          if [[ -f CHANGELOG.md ]]; then
            # Create temp file with new entry then append old changelog
            echo -e "$ENTRY$(cat CHANGELOG.md)" > CHANGELOG.md
          else
            echo -e "$ENTRY" > CHANGELOG.md
          fi

          git add CHANGELOG.md
          git commit -m "Update changelog for PR #${{ steps.pr_data.outputs.number }}"
          git push
