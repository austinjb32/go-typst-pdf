name: 📜 Changelog Creator
run-name: ${{ github.actor }} is creating a changelog 📜

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Get PR Metadata & Changelog
        id: pr_data
        run: |
          PR_JSON=$(gh pr view ${{ github.event.number }} --json title,author,number,body,url)

          TITLE=$(echo "$PR_JSON" | jq -r '.title')
          AUTHOR=$(echo "$PR_JSON" | jq -r '.author.login')
          NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          URL=$(echo "$PR_JSON" | jq -r '.url')
          CHANGELOG=$(echo "$PR_JSON" | jq -r '.body' | awk '/^## Release Changelog \(Required\)/{flag=1; next} /^## /{flag=0} flag')

          CHANGELOG_ESCAPED=$(printf '%s\n' "$CHANGELOG")

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT
          echo "number=$NUMBER" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_ESCAPED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format and prepend changelog entry
        run: |
          ENTRY="#${{ steps.pr_data.outputs.number }} ${{ steps.pr_data.outputs.title }} (@${{ steps.pr_data.outputs.author }})\nChangelog:\n\n"

          while IFS= read -r line; do
            [[ -n "$line" ]] && [[ "$line" =~ ^[[:space:]]*- ]] && ENTRY+="$line\n" || ENTRY+="- $line\n"
          done <<< "${{ steps.pr_data.outputs.changelog }}"

          ENTRY+="\n---\n\n"

          { echo -e "$ENTRY"; [[ -f CHANGELOG.md ]] && cat CHANGELOG.md; } > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md

          git add CHANGELOG.md
          git commit -m "📝 Update changelog for PR #${{ steps.pr_data.outputs.number }}"
          git push
