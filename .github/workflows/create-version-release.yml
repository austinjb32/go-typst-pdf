name: 🚀 Auto Version Release from PR Changelogs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "${{ github.event.inputs.version }}" | tail -n 1)
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Get merged PRs since previous tag
        id: pr_list
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          PREV_DATE=$(git log -1 --format=%cI $PREV_TAG)
          gh pr list --state merged --base main --search "merged:>$PREV_DATE" --json number > prs.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelogs from PRs
        id: changelogs
        run: |
          PRS=$(jq '.[].number' prs.json)
          TEMPFILE=changelog_sections.txt
          > $TEMPFILE
          for pr in $PRS; do
            BODY=$(gh pr view $pr --json body,title,author,number,url --jq '.body')
            TITLE=$(gh pr view $pr --json title --jq '.title')
            AUTHOR=$(gh pr view $pr --json author --jq '.author.login')
            URL=$(gh pr view $pr --json url --jq '.url')
            SECTION=$(echo "$BODY" | awk '/^## Release Changelog \(Required\)/{flag=1; next} /^## /{flag=0} flag')
            if [ -n "$SECTION" ]; then
              echo "### $TITLE ([#$pr]($URL)) by @$AUTHOR" >> $TEMPFILE
              echo "$SECTION" | sed '/^\s*$/d' >> $TEMPFILE
              echo "" >> $TEMPFILE
            fi
          done
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat $TEMPFILE >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release body
        id: release_body
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          VERSION="${{ github.event.inputs.version }}"
          {
            echo "What's Changed"
            echo ""
            echo "${{ steps.changelogs.outputs.changelog }}"
            echo "Full Changelog: $PREV_TAG...$VERSION"
          } > release_body.txt
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat release_body.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          target_commitish: main
          name: "🚀 Release ${{ github.event.inputs.version }}"
          body: ${{ steps.release_body.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}