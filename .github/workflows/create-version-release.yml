name: 🚀 Trigger Version Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.4)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v3

      - name: 🛠️ Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: 🔍 Check for CHANGELOG.md
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "❌ CHANGELOG.md not found!"
            exit 1
          fi

      - name: 📦 Extract release block from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${{ github.event.inputs.version }}"
          DATE=$(date +"%d-%m-%Y")

          # Extract topmost block (until first --- line)
          CONTENT=$(awk '/^---/{exit} {print}' CHANGELOG.md)

          RELEASE_MD="## 🚀 Release $VERSION — Latest

        📅 Date: $DATE

        ---

        ### 📝 Changelog
        "
                CONTRIBUTORS=()

                IFS=$'\n'
                while read -r line; do
                    if [[ "$line" =~ ^###\ \[\#([0-9]+)\]\(([^)]+)\)\ (.+)$ ]]; then
                    PR_NUMBER="${BASH_REMATCH[1]}"
                    PR_URL="${BASH_REMATCH[2]}"
                    PR_TITLE="${BASH_REMATCH[3]}"
                    RELEASE_MD+="
        🔖 [#${PR_NUMBER}](${PR_URL}) ${PR_TITLE}
        "
                    elif [[ "$line" =~ ^\*Author:\*\ @(.+) ]]; then
                    AUTHOR="@${BASH_REMATCH[1]}"
                    RELEASE_MD+="👤 Author: $AUTHOR
        "
                    CONTRIBUTORS+=("$AUTHOR")
                    elif [[ "$line" =~ ^- ]]; then
                    RELEASE_MD+="$line
        "
                    fi
                done <<< "$CONTENT"

                RELEASE_MD+="
        ---

        ### 🙌 Contributors

        "

                for contributor in $(printf "%s\n" "${CONTRIBUTORS[@]}" | sort -u); do
                    RELEASE_MD+="- $contributor
        "
                done

                RELEASE_MD+="
        ---

        ❤️ Thank you for contributing!
        "

          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_MD" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🏷️ Create Git Tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          target_commitish: main  # Change this if you tag from a different branch
          name: "🚀 Release ${{ github.event.inputs.version }} — Latest"
          body: ${{ steps.changelog.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
