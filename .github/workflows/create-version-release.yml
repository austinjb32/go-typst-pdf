name: Trigger Version Release
run-name: ${{ github.actor }} is triggering a version release 🚀

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.2.3)"
        required: true
      target-branch:
        description: "Branch to tag"
        default: main
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          # Extract the first changelog block (up to next date or EOF)
          RELEASE_NOTES=$(awk 'NR==1{print; next} /^[0-9]{2}-[0-9]{2}-[0-9]{4}/ {exit} {print}' CHANGELOG.md)

          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          target_commitish: ${{ github.event.inputs.target-branch }}
          name: Release ${{ github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
