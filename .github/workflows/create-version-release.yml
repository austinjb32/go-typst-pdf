name: 🚀 AI Inference Release Notes

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump?"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Get latest tag
        id: get_tag
        run: |
          TAG=$(git tag --sort=-creatordate | head -n 1)
          if [ -z "$TAG" ]; then
            TAG="v0.0.0"
          fi
          echo "current_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: next_version
        run: |
          CUR="${{ steps.get_tag.outputs.current_tag }}"
          CUR="${CUR#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CUR"
          BUMP="${{ github.event.inputs.bump }}"
          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          NEXT="v$MAJOR.$MINOR.$PATCH"
          echo "next_version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Get merged PRs since previous tag
        id: pr_list
        run: |
          PREV_TAG="${{ steps.get_tag.outputs.current_tag }}"
          if [ "$PREV_TAG" = "v0.0.0" ]; then
            PREV_DATE=$(git log --reverse --format=%cI | head -n 1)
          else
            PREV_DATE=$(git log -1 --format=%cI "$PREV_TAG")
          fi
          gh pr list --state merged --base main --search "merged:>$PREV_DATE" --json number > prs.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch PR details for AI
        id: fetch_prs
        run: |
          PRS=$(jq '.[].number' prs.json)
          if [ -z "$PRS" ]; then
            echo "prs_json=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "[" > pr_summaries.json
          FIRST=1
          for pr in $PRS; do
            if [ $FIRST -eq 0 ]; then
              echo "," >> pr_summaries.json
            fi
            gh pr view $pr --json number,title,body,author,url,mergedAt >> pr_summaries.json
            FIRST=0
          done
          echo "]" >> pr_summaries.json
          PRS_JSON_ESCAPED=$(jq -c . pr_summaries.json)
          echo "prs_json=$PRS_JSON_ESCAPED" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: AI Inference - Summarize Release Notes
        id: ai_release_notes
        uses: actions/ai-inference@v1
        with:
          system-prompt: |
            You are a helpful assistant that summarizes pull requests into a clear, user-facing changelog.
            Group similar changes, deduplicate where possible, and use concise, readable language.
            Use bullet points. Do not mention PR numbers unless necessary.
          prompt: |
            The following pull requests were merged since the last release:
            ${{ steps.fetch_prs.outputs.prs_json }}

      - name: Build release body
        id: release_body
        run: |
          PREV_TAG="${{ steps.get_tag.outputs.current_tag }}"
          VERSION="${{ steps.next_version.outputs.next_version }}"
          NOTES="${{ steps.ai_release_notes.outputs.result }}"
          {
            echo "## What's Changed"
            echo ""
            echo "$NOTES"
            echo ""
            echo "**Full Changelog**: [$PREV_TAG...$VERSION](https://github.com/${{ github.repository }}/compare/$PREV_TAG...$VERSION)"
          } > release_body.txt
          {
            echo "body<<EOF"
            cat release_body.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Git Tag
        run: |
          git checkout main
          git pull origin main
          git tag ${{ steps.next_version.outputs.next_version }}
          git push origin ${{ steps.next_version.outputs.next_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.next_version.outputs.next_version }}
          target_commitish: main
          name: "🚀 Release ${{ steps.next_version.outputs.next_version }}"
          body: ${{ steps.release_body.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
