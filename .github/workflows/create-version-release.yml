name: 🚀 Trigger Version Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.4)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v3

      - name: 🛠️ Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: 🔍 Check for CHANGELOG.md
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "❌ CHANGELOG.md not found!"
            exit 1
          fi

      - name: 📦 Extract release block from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${{ github.event.inputs.version }}"
          
          cat > CHANGELOG.md << EOF
          ## 🚀 Release $VERSION
          EOF
          
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: 🏷️ Create Git Tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          target_commitish: main  # Change this if you tag from a different branch
          name: "🚀 ${{ github.event.inputs.version }}"
          body: ${{ steps.changelog.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
