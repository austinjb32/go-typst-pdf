name: 🚀 Auto Gem Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump?"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set git config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global user.name "$(gh api /users/${GITHUB_ACTOR} | jq .name -r)"
          git config -l

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ruby

      - name: Install the gem-release
        run: gem install gem-release

      - name: Bump version and get latest tag
        id: get_tag
        run: ./scripts/get_latest_tag.sh ${{ github.event.inputs.bump }}

      - name: Generate changelog
        id: changelog
        run: ./scripts/generate_changelog.sh "${{ steps.get_tag.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          BODY="${{ steps.changelog.outputs.body }}"

          gh release create "$TAG" \
            --title "🚀 Release $TAG" \
            --notes "$BODY" \
            --target main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Push gem
      #   env:
      #     CM_GEMS_PASSWORD: ${{ vars.CM_GEMS_PASSWORD }}
      #     CM_GEMS_HOST: ${{ vars.CM_GEMS_HOST }}
      #   run: ./upload.sh $CM_GEMS_PASSWORD $CM_GEMS_HOST
